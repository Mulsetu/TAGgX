name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # next build works without real secrets configured — most routes
      # are dynamically rendered, not statically generated at build time,
      # so nothing here actually reaches Supabase/R2/Razorpay/Brevo. These
      # placeholders exist only so a `process.env.X!` non-null assertion
      # doesn't throw during the build; they're never used to make a real
      # request. Never put real secrets in this file — use repo/environment
      # secrets (Settings > Secrets and variables > Actions) if a future
      # step genuinely needs one.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SECRET_KEY: placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:3000
